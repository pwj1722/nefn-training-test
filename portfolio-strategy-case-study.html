<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEFN Portfolio Strategy Case Study</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=Fraunces:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0B2545;
  --navy-dark: #081C36;
  --navy-90: rgba(11,37,69,0.9);
  --cyan: #1EA8CF;
  --cyan-light: #E8F4F8;
  --cyan-mid: #B3E5F6;
  --green: #1B8A5A;
  --green-light: #F0FFF4;
  --amber: #D4920B;
  --amber-light: #FFF8E6;
  --red: #C0392B;
  --red-light: #FFF0F0;
  --purple: #6C63AC;
  --purple-light: #F3F0FF;
  --teal: #2BA5B5;
  --dark: #1C1C1C;
  --mid: #555;
  --light: #F4F6F9;
  --white: #fff;
  --shadow: 0 2px 12px rgba(11,37,69,0.07);
  --shadow-lg: 0 8px 32px rgba(11,37,69,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:var(--light); color:var(--dark); min-height:100vh; }

.header { background:var(--navy); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:3px solid var(--cyan); }
.header-left { display:flex; align-items:center; gap:12px; }
.header-logo { width:34px; height:34px; background:var(--cyan); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:var(--navy); font-size:17px; }
.header-title { color:var(--white); font-size:15px; font-weight:600; }
.header-sub { color:var(--cyan); font-size:10px; letter-spacing:2px; text-transform:uppercase; font-weight:500; }
.header-badge { background:rgba(30,168,207,0.15); color:var(--cyan); font-size:10px; font-weight:600; padding:5px 12px; border-radius:16px; }

.main { max-width:960px; margin:0 auto; padding:24px 20px 60px; }

/* Progress */
.progress-bar { background:#dde3ea; height:5px; border-radius:3px; overflow:hidden; margin-bottom:6px; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--cyan),var(--teal)); border-radius:3px; transition:width 0.5s ease; }
.progress-info { display:flex; justify-content:space-between; font-size:11px; color:var(--mid); font-weight:500; margin-bottom:16px; }

/* Case Header */
.case-header { background:var(--navy); border-radius:14px; padding:28px 30px; margin-bottom:20px; position:relative; overflow:hidden; }
.case-header::after { content:''; position:absolute; right:-30px; top:-30px; width:160px; height:160px; border-radius:50%; background:rgba(30,168,207,0.06); }
.case-tag { display:inline-block; background:rgba(30,168,207,0.2); color:var(--cyan); font-size:10px; font-weight:600; padding:4px 12px; border-radius:14px; letter-spacing:1.2px; text-transform:uppercase; margin-bottom:10px; }
.case-header h2 { color:var(--white); font-family:'Fraunces',serif; font-size:22px; font-weight:700; margin-bottom:6px; }
.case-header p { color:var(--cyan-mid); font-size:13px; line-height:1.6; }

/* Client Panel - persistent sidebar on larger screens */
.content-wrap { display:grid; grid-template-columns:1fr; gap:20px; }
@media(min-width:780px) { .content-wrap { grid-template-columns:280px 1fr; } }

.client-panel { background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:20px; border-top:4px solid var(--cyan); height:fit-content; position:sticky; top:20px; }
.client-panel h3 { font-size:13px; color:var(--navy); font-weight:700; margin-bottom:12px; letter-spacing:0.5px; display:flex; align-items:center; gap:6px; }
.client-panel .cp-section { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #eef1f5; }
.client-panel .cp-section:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.client-panel .cp-label { font-size:10px; color:var(--mid); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.client-panel .cp-row { display:flex; justify-content:space-between; font-size:12px; padding:3px 0; }
.client-panel .cp-row .k { color:var(--mid); }
.client-panel .cp-row .v { color:var(--dark); font-weight:600; }
.client-panel .cp-alloc-bar { height:14px; border-radius:7px; display:flex; overflow:hidden; margin-top:6px; margin-bottom:4px; }
.client-panel .cp-alloc-bar div { height:100%; transition:width 0.4s ease; }
.alloc-legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:6px; }
.alloc-legend span { font-size:10px; color:var(--mid); display:flex; align-items:center; gap:4px; }
.alloc-legend .dot { width:8px; height:8px; border-radius:2px; }

/* Question Area */
.q-card { background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:24px 26px; animation:slideUp 0.35s ease-out; }
@keyframes slideUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
.q-phase { font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--cyan); margin-bottom:8px; }
.q-text { font-family:'Fraunces',serif; font-size:17px; font-weight:600; color:var(--navy); line-height:1.5; margin-bottom:8px; }
.q-context { background:var(--light); border-radius:8px; padding:12px 14px; font-size:12px; color:var(--mid); line-height:1.55; margin-bottom:18px; font-style:italic; }
.q-context strong { color:var(--dark); font-style:normal; }

/* Options */
.options { display:flex; flex-direction:column; gap:9px; }
.opt-btn { display:flex; align-items:flex-start; gap:10px; background:var(--light); border:2px solid transparent; border-radius:9px; padding:14px 16px; cursor:pointer; transition:all 0.2s; text-align:left; font-family:inherit; font-size:13px; color:var(--dark); line-height:1.5; width:100%; }
.opt-btn:hover:not(:disabled) { border-color:var(--cyan); background:var(--cyan-light); }
.opt-btn .letter { background:var(--navy); color:var(--white); min-width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
.opt-btn.correct { border-color:var(--green); background:var(--green-light); }
.opt-btn.correct .letter { background:var(--green); }
.opt-btn.wrong { border-color:var(--red); background:var(--red-light); }
.opt-btn.wrong .letter { background:var(--red); }
.opt-btn.mid { border-color:var(--amber); background:var(--amber-light); }
.opt-btn.mid .letter { background:var(--amber); }
.opt-btn.faded { opacity:0.45; pointer-events:none; }
.opt-btn:disabled { cursor:default; }

/* Feedback */
.feedback { border-radius:10px; padding:18px 20px; margin-top:16px; display:none; animation:slideUp 0.3s ease-out; }
.feedback.show { display:block; }
.feedback.good { background:var(--green-light); border-left:4px solid var(--green); }
.feedback.okay { background:var(--amber-light); border-left:4px solid var(--amber); }
.feedback.bad { background:var(--red-light); border-left:4px solid var(--red); }
.fb-title { font-weight:700; font-size:13px; margin-bottom:5px; }
.fb-body { font-size:12px; color:var(--dark); line-height:1.6; }
.fb-coach { background:rgba(255,255,255,0.55); border-radius:7px; padding:10px 14px; margin-top:10px; font-size:12px; line-height:1.6; }
.fb-coach .coach-label { font-weight:700; color:var(--navy); font-size:10px; letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:3px; }

/* Next */
.next-btn { background:var(--cyan); color:var(--white); border:none; padding:12px 28px; border-radius:9px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; display:none; margin-top:14px; }
.next-btn:hover { background:var(--teal); }
.next-btn.show { display:inline-flex; align-items:center; gap:6px; }

/* Decision Log */
.decision-log { margin-top:16px; }
.decision-log summary { font-size:12px; font-weight:600; color:var(--navy); cursor:pointer; padding:8px 0; }
.decision-log .dl-item { font-size:11px; color:var(--mid); padding:4px 0 4px 12px; border-left:2px solid #dde3ea; margin:4px 0; line-height:1.5; }
.decision-log .dl-item.good { border-left-color:var(--green); }
.decision-log .dl-item.okay { border-left-color:var(--amber); }
.decision-log .dl-item.bad { border-left-color:var(--red); }

/* Score */
.score-card { background:var(--white); border-radius:14px; padding:32px; box-shadow:var(--shadow-lg); text-align:center; animation:slideUp 0.4s ease-out; }
.score-ring { width:110px; height:110px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 18px; border:5px solid; }
.score-ring .num { font-family:'Fraunces',serif; font-size:32px; font-weight:700; }
.score-ring .lbl { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
.score-card h2 { font-family:'Fraunces',serif; font-size:20px; color:var(--navy); margin-bottom:6px; }
.score-card .msg { font-size:13px; color:var(--mid); line-height:1.6; margin-bottom:22px; max-width:540px; margin-left:auto; margin-right:auto; }
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
.stat-box { background:var(--light); border-radius:10px; padding:14px; }
.stat-box .sn { font-family:'Fraunces',serif; font-size:26px; font-weight:700; }
.stat-box .sl { font-size:10px; color:var(--mid); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-top:2px; }
.score-btn { background:var(--navy); color:var(--white); border:none; padding:12px 28px; border-radius:9px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; margin:0 6px; transition:all 0.2s; }
.score-btn:hover { background:var(--navy-dark); }
.score-btn.sec { background:var(--white); color:var(--navy); border:2px solid #d0d8e0; }
.score-btn.sec:hover { border-color:var(--navy); }

/* Recommendation Summary */
.rec-summary { background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:24px; margin-top:20px; text-align:left; }
.rec-summary h3 { font-family:'Fraunces',serif; font-size:16px; color:var(--navy); margin-bottom:14px; }
.rec-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eef1f5; }
.rec-row:last-child { border-bottom:none; }
.rec-dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.rec-label { font-size:12px; font-weight:600; color:var(--navy); flex:1; }
.rec-val { font-size:12px; color:var(--mid); }

/* Intro Screen */
.intro { text-align:center; max-width:680px; margin:40px auto; }
.intro-icon { font-size:48px; margin-bottom:16px; }
.intro h1 { font-family:'Fraunces',serif; font-size:28px; color:var(--navy); margin-bottom:10px; }
.intro .sub { font-size:14px; color:var(--mid); line-height:1.6; margin-bottom:28px; }
.intro .client-preview { background:var(--white); border-radius:12px; box-shadow:var(--shadow); padding:24px; text-align:left; margin-bottom:28px; border-left:4px solid var(--cyan); }
.intro .client-preview h3 { font-size:14px; color:var(--navy); margin-bottom:10px; }
.intro .client-preview .row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
.intro .client-preview .row .k { color:var(--mid); }
.intro .client-preview .row .v { color:var(--dark); font-weight:600; }
.start-btn { background:var(--cyan); color:var(--white); border:none; padding:16px 40px; border-radius:10px; font-family:inherit; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.start-btn:hover { background:var(--teal); transform:translateY(-1px); }
.features { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
.feat { background:var(--white); border-radius:10px; padding:16px; box-shadow:var(--shadow); }
.feat .fi { font-size:22px; margin-bottom:6px; }
.feat .ft { font-size:12px; font-weight:700; color:var(--navy); margin-bottom:3px; }
.feat .fd { font-size:11px; color:var(--mid); line-height:1.4; }

@media(max-width:640px) {
  .header { padding:12px 14px; }
  .main { padding:18px 14px 40px; }
  .case-header { padding:22px 18px; }
  .case-header h2 { font-size:18px; }
  .q-card { padding:20px 18px; }
  .features { grid-template-columns:1fr; }
  .stat-grid { grid-template-columns:1fr; }
  .content-wrap { grid-template-columns:1fr; }
  .client-panel { position:static; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-logo">N</div>
    <div>
      <div class="header-title">NEFN Training Hub</div>
      <div class="header-sub">Portfolio Strategy Case Study</div>
    </div>
  </div>
  <div class="header-badge">For Internal Use Only</div>
</div>

<div class="main" id="app"></div>

<script>
// ===================== CLIENT DATA =====================
const CLIENT = {
  name: "The Martinelli Family",
  people: "Anthony (57) & Diane (54)",
  income: "$485,000 combined",
  anthony_job: "Regional VP, medical device company",
  diane_job: "Part-time interior designer ($45K/yr)",
  retirement_goal: "Anthony wants to retire at 62 (5 years)",
  risk: "Moderate — lost sleep in 2022 but didn't sell",
  tax_bracket: "35% federal + 6.37% NJ state",
  total_assets: "$2,840,000",
  accounts: [
    { name: "Anthony 401(k)", val: "$1,120,000", detail: "Target date 2030 fund (one fund)" },
    { name: "Diane IRA", val: "$340,000", detail: "Mix of 12 individual stocks (self-selected)" },
    { name: "Joint Brokerage", val: "$620,000", detail: "60% AAPL, 20% MSFT, 20% cash" },
    { name: "Anthony IRA (rollover)", val: "$280,000", detail: "Money market — hasn't been invested since 2019 rollover" },
    { name: "Savings / CDs", val: "$180,000", detail: "Laddered CDs earning 4.2% avg" },
    { name: "Company Stock (RSUs)", val: "$300,000", detail: "Unvested RSUs vesting over next 3 years" },
  ],
  insurance: "Anthony: $400K group term. Diane: None.",
  estate: "Simple wills from 2014. No trust. No POA update since.",
  current_alloc: { stocks: 62, bonds: 3, cash: 22, alts: 0, other: 13 },
  issues: [
    "80% of brokerage is in two tech stocks (AAPL + MSFT)",
    "$280K IRA sitting in money market for 5+ years",
    "$1.12M 401(k) in a single target-date fund",
    "No fixed income allocation despite 5-year retirement horizon",
    "No alternatives exposure for diversification",
    "RSUs add MORE concentration to an already tech-heavy portfolio",
    "Diane's IRA: 12 random stocks with no strategy",
    "Insurance gap: $400K group term with $485K income & non-working spouse goals",
  ]
};

// ===================== QUESTIONS =====================
const QUESTIONS = [
  {
    phase: "Initial Assessment",
    num: 1,
    question: "You've just reviewed the Martinellis' account statements. Before making any recommendations, what's the FIRST thing you should address with them?",
    context: "Anthony seems proud of his Apple and Microsoft gains. Diane is quieter and mentions she \"just picks stocks she reads about.\" They've never worked with an advisor before.",
    options: [
      { text: "Start recommending specific investments to replace their current holdings.", quality: "bad" },
      { text: "Walk them through what you see: the concentration risk, the uninvested IRA, and the lack of a cohesive strategy — then ask what their goals and concerns are before proposing anything.", quality: "good" },
      { text: "Tell Anthony he needs to sell his Apple stock immediately because it's too risky.", quality: "bad" },
      { text: "Compliment their portfolio growth and suggest a few minor tweaks.", quality: "okay" },
    ],
    feedback: {
      good: { title: "Diagnose before you prescribe.", text: "You need to show them the full picture — concentration, missing asset classes, uninvested cash — without making them feel stupid about past decisions. Then connect it to THEIR goals: retiring in 5 years, protecting Diane, generating income. The recommendations must flow from their goals, not your product shelf.", coach: "Frame it as: \"You've done well building this — now let's make sure it's working together as a system, not just a collection of accounts.\"" },
      okay: { title: "Don't sugarcoat it.", text: "Complimenting a portfolio that's 80% in two stocks, has $280K uninvested, and zero fixed income 5 years from retirement does the client a disservice. You can acknowledge their growth without pretending the structure is sound." },
      bad: { title: "Too fast, too aggressive.", text: "Recommending investments before understanding their goals, or demanding they sell winners, will destroy trust immediately. Anthony is emotionally attached to those Apple gains. You need to lead him to the conclusion — not force it." },
    }
  },
  {
    phase: "Account Structure",
    num: 2,
    question: "The Martinellis have 6 accounts spread across 4 custodians with no coordination. What account structure would you recommend to get them organized?",
    context: "Anthony's 401(k) stays with his employer. The rollover IRA, Diane's IRA, and the joint brokerage can all be consolidated. The CDs are at a local bank.",
    options: [
      { text: "Move the rollover IRA, Diane's IRA, and joint brokerage into advisory accounts on your platform. Keep the 401(k) at the employer and the CDs at the bank for now.", quality: "good" },
      { text: "Move everything — including the 401(k) and CDs — to your platform immediately.", quality: "bad" },
      { text: "Leave everything where it is and just give them allocation advice.", quality: "okay" },
      { text: "Only bring the joint brokerage over. Leave the IRAs where they are.", quality: "okay" },
    ],
    feedback: {
      good: { title: "Smart consolidation.", text: "You're consolidating what you CAN move ($1,240,000 across three accounts) into a coordinated advisory relationship while leaving what SHOULD stay (active 401(k) with employer match, CDs providing safe cash). This gives you oversight of $1.24M under management with the ability to influence the 401(k) allocation through advice.", coach: "Advisory vs. Brokerage Decision: The rollover IRA and Diane's IRA should be advisory accounts (ongoing management, rebalancing). The joint brokerage could be advisory OR brokerage depending on how actively you'll manage it — with $620K in concentrated stock that needs systematic unwinding, advisory makes sense here." },
      okay: { title: "Partial solution.", text: "Leaving everything in place or only taking one account limits your ability to coordinate across the full picture. The power of consolidation is that you can manage asset location, rebalancing, and tax-loss harvesting holistically — you can't do that across 4 custodians." },
      bad: { title: "You can't move an active 401(k).", text: "The 401(k) can't be moved while Anthony is still employed. And pulling CDs with no alternative plan disrupts their safe money. Always consolidate strategically, not indiscriminately." },
    }
  },
  {
    phase: "Concentration Risk",
    num: 3,
    question: "The joint brokerage is 60% Apple and 20% Microsoft — $496K in two stocks. Plus $300K in RSUs vesting over 3 years (also tech). Anthony says: \"Apple's been great to me. I don't want to sell.\" How do you handle this?",
    context: "Anthony bought Apple at $45/share. His cost basis is about $85K on a position now worth $372K — meaning $287K in unrealized gains. Selling all at once would trigger ~$57K in federal + state capital gains taxes.",
    options: [
      { text: "\"I understand — and you've done incredibly well. I'm not asking you to sell it all. But here's the risk: your paycheck comes from a medical device company, your RSUs are tech, and 80% of your brokerage is tech. If the tech sector has a bad year like 2022 — when the Nasdaq dropped 33% — your portfolio could lose $500K+ while your RSUs lose value simultaneously. Let me show you how we can systematically reduce the concentration over 2-3 years in a tax-efficient way.\"", quality: "good" },
      { text: "\"You need to sell all the Apple stock now. The concentration risk is too high.\"", quality: "bad" },
      { text: "\"Apple is a great company, so let's just leave it and focus on the other accounts.\"", quality: "bad" },
      { text: "\"What if we used a structured note linked to the S&P 500 with some of the proceeds? You'd get market participation with downside protection.\"", quality: "okay" },
    ],
    feedback: {
      good: { title: "Perfect — empathetic, factual, and strategic.", text: "You validated his success, quantified the risk in terms he can visualize (2022 Nasdaq drop), and proposed a multi-year approach that reduces both the concentration AND the tax hit. Systematic unwinding over 2-3 years using tax-loss harvesting from other positions and staying within favorable capital gains brackets is the right strategy.", coach: "Tax-Smart Unwinding: Sell $100-150K of Apple per year, harvest losses from Diane's 12 random stocks to offset gains, time sales around RSU vesting to manage annual tax exposure. This is a 2-3 year project — which means 2-3 years of advisory engagement." },
      okay: { title: "Good product idea, wrong timing.", text: "Structured notes could absolutely be part of the reinvestment strategy later, but jumping to a product recommendation before Anthony agrees to the underlying concept (reducing concentration) puts the cart before the horse. Get buy-in on the strategy first, then discuss implementation vehicles." },
      bad: { title: "Either too aggressive or too passive.", text: "Demanding he sell everything ignores the $57K tax hit and his emotional attachment. Leaving it alone ignores a career-threatening level of concentration risk. The answer is always in the middle: systematic, tax-efficient reduction over time." },
    }
  },
  {
    phase: "The Uninvested IRA",
    num: 4,
    question: "Anthony's $280K rollover IRA has been sitting in a money market fund since he rolled it over from a previous employer in 2019. That's 6+ years of missed market growth. How do you address this?",
    context: "If this $280K had been invested in a 60/40 portfolio since 2019, it would be worth approximately $400-420K today. That's $120-140K in missed gains. Anthony says he \"just never got around to investing it.\"",
    options: [
      { text: "\"Anthony, this one's actually good news — it's the easiest win we can deliver. This $280K has been on the sidelines for six years. I'd recommend we build a diversified portfolio here aligned with your 5-year retirement timeline: a mix of intermediate bonds, some equity exposure for growth, and a sleeve of alternatives for diversification. We can dollar-cost average in over 3-4 months if moving it all at once makes you uncomfortable.\"", quality: "good" },
      { text: "\"Let's put all $280K into an S&P 500 index fund today.\"", quality: "bad" },
      { text: "\"Since it's been in cash this long, let's just keep it safe and buy CDs in the IRA.\"", quality: "okay" },
      { text: "\"This IRA should go into a fixed indexed annuity. You'll get market-linked growth with downside protection, which is perfect for someone approaching retirement.\"", quality: "okay" },
    ],
    feedback: {
      good: { title: "Clear rationale and a confidence-building approach.", text: "You quantified the opportunity cost (missed $120-140K), proposed an allocation appropriate for the timeline (5 years = moderate, not aggressive), and offered dollar-cost averaging to reduce anxiety about investing a lump sum. This IRA is the perfect place for fixed income allocation since bond interest is taxed as ordinary income anyway — sheltering it in the IRA is tax-efficient.", coach: "Asset Location Win: Bonds in the IRA (tax-deferred) = shelters ordinary income. Keep equity index funds in the taxable brokerage where they get favorable long-term capital gains rates. This is the asset location strategy from the Tax-Smart training in action." },
      okay: { title: "Not wrong, but not the best use of this account.", text: "CDs in an IRA waste the tax-sheltered space — CDs don't generate much tax anyway. A fixed indexed annuity inside an IRA is redundant since the IRA already provides tax deferral — you'd be wrapping a tax-deferred vehicle inside another tax-deferred vehicle, adding fees for a benefit he already has. Annuities make more sense in taxable accounts or with non-qualified money." },
      bad: { title: "Too aggressive for the situation.", text: "Putting $280K into 100% equities for someone who's 5 years from retirement and admittedly lost sleep in 2022 is irresponsible. He needs a balanced approach that reflects his timeline and risk tolerance. And investing a lump sum all at once amplifies timing risk and anxiety." },
    }
  },
  {
    phase: "Diane's IRA",
    num: 5,
    question: "Diane's $340K IRA holds 12 individual stocks she picked from articles and TV shows. Some are up, some are down significantly. What's your approach?",
    context: "Holdings include: Peloton (down 82%), Beyond Meat (down 74%), Disney (down 28%), Nvidia (up 340%), Tesla (up 45%), and 7 other random picks. No theme, no strategy. Diane admits she \"doesn't really know what she's doing.\"",

        <div class="feat"><div class="fi">🎯</div><div class="ft">Builds Sequentially</div><div class="fd">Each question advances the case — your early decisions shape later recommendations.</div></div>
        <div class="feat"><div class="fi">💼</div><div class="ft">Real Products</div><div class="fd">Advisory, brokerage, annuities, structured notes, alternatives, tax strategy.</div></div>
        <div class="feat"><div class="fi">📝</div><div class="ft">Coaching Notes</div><div class="fd">Expert feedback on every answer with scripts and implementation tips.</div></div>
      </div>
      <div class="client-preview">
        <h3>📋 Meet Your Clients: ${CLIENT.name}</h3>
        <div class="row"><span class="k">Clients</span><span class="v">${CLIENT.people}</span></div>
        <div class="row"><span class="k">Income</span><span class="v">${CLIENT.income}</span></div>
        <div class="row"><span class="k">Anthony</span><span class="v">${CLIENT.anthony_job}</span></div>
        <div class="row"><span class="k">Diane</span><span class="v">${CLIENT.diane_job}</span></div>
        <div class="row"><span class="k">Retirement Goal</span><span class="v">${CLIENT.retirement_goal}</span></div>
        <div class="row"><span class="k">Total Assets</span><span class="v">${CLIENT.total_assets}</span></div>
        <div class="row"><span class="k">Risk Tolerance</span><span class="v">${CLIENT.risk}</span></div>
        <div class="row" style="margin-top:8px;padding-top:8px;border-top:1px solid #eef1f5"><span class="k">Key Issue</span><span class="v" style="color:var(--red)">80% of brokerage in 2 tech stocks, $280K uninvested, 0% alternatives, no fixed income plan</span></div>
      </div>
      <button class="start-btn" onclick="startCase()">Begin Case Study →</button>
    </div>`;
}

function startCase() { started=true; qIdx=0; answered=false; log=[]; score={good:0,okay:0,bad:0}; render(); }

function renderQuestion() {
  const q = QUESTIONS[qIdx];
  const pct = (qIdx/QUESTIONS.length*100).toFixed(0);
  const letters = ['A','B','C','D'];
  const ac = CLIENT.current_alloc;

  let logHtml = '';
  if (log.length) {
    logHtml = '<details class="decision-log"><summary>📋 Your Decisions So Far ('+log.length+')</summary>';
    log.forEach(l => { logHtml += `<div class="dl-item ${l.quality}"><strong>Q${l.num}:</strong> ${l.text}</div>`; });
    logHtml += '</details>';
  }

  app.innerHTML = `
    <div class="progress-info"><span>Case Study: ${CLIENT.name}</span><span>Question ${qIdx+1} of ${QUESTIONS.length}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="case-header">
      <div class="case-tag">${q.phase} — Question ${q.num} of 15</div>
      <h2>${q.question}</h2>
      ${q.context ? `<p>${q.context}</p>` : ''}
    </div>
    <div class="content-wrap">
      <div class="client-panel">
        <h3>📋 Client Snapshot</h3>
        <div class="cp-section">
          <div class="cp-label">Household</div>
          <div class="cp-row"><span class="k">Clients</span><span class="v">${CLIENT.people}</span></div>
          <div class="cp-row"><span class="k">Income</span><span class="v">${CLIENT.income}</span></div>
          <div class="cp-row"><span class="k">Retire</span><span class="v">5 years (age 62)</span></div>
          <div class="cp-row"><span class="k">Tax Bracket</span><span class="v">35% + NJ</span></div>
        </div>
        <div class="cp-section">
          <div class="cp-label">Current Allocation</div>
          <div class="cp-alloc-bar">
            <div style="width:${ac.stocks}%;background:var(--cyan)"></div>
            <div style="width:${ac.bonds}%;background:var(--green)"></div>
            <div style="width:${ac.cash}%;background:var(--amber)"></div>
            <div style="width:${ac.alts}%;background:var(--purple)"></div>
            <div style="width:${ac.other}%;background:#ccc"></div>
          </div>
          <div class="alloc-legend">
            <span><span class="dot" style="background:var(--cyan)"></span>${ac.stocks}% Stocks</span>
            <span><span class="dot" style="background:var(--green)"></span>${ac.bonds}% Bonds</span>
            <span><span class="dot" style="background:var(--amber)"></span>${ac.cash}% Cash</span>
            <span><span class="dot" style="background:var(--purple)"></span>${ac.alts}% Alts</span>
          </div>
        </div>
        <div class="cp-section">
          <div class="cp-label">Accounts</div>
          ${CLIENT.accounts.map(a => `<div class="cp-row"><span class="k" style="font-size:10px">${a.name}</span><span class="v" style="font-size:10px">${a.val}</span></div>`).join('')}
        </div>
        ${logHtml}
      </div>
      <div>
        <div class="q-card">
          <div class="q-phase">${q.phase}</div>
          <div class="options" id="opts">
            ${q.options.map((o,i) => `<button class="opt-btn" id="o${i}" onclick="pick(${i})" ${answered?'disabled':''}><span class="letter">${letters[i]}</span><span>${o.text}</span></button>`).join('')}
          </div>
          <div class="feedback" id="fb"></div>
          <button class="next-btn" id="nxt" onclick="next()">Continue →</button>
        </div>
      </div>
    </div>`;
}

function pick(idx) {
  if (answered) return;
  answered = true;
  const q = QUESTIONS[qIdx];
  const sel = q.options[idx];
  score[sel.quality]++;
  log.push({ num: q.num, text: sel.text.substring(0,80)+'...', quality: sel.quality });

  q.options.forEach((o,i) => {
    const btn = document.getElementById('o'+i);
    btn.disabled = true;
    if (i===idx) btn.classList.add(sel.quality==='good'?'correct':sel.quality==='bad'?'wrong':'mid');
    else if (o.quality==='good' && sel.quality!=='good') btn.classList.add('correct');
    else btn.classList.add('faded');
  });

  const fb = q.feedback[sel.quality];
  if (fb && fb.title) {
    const el = document.getElementById('fb');
    el.className = `feedback show ${sel.quality==='good'?'good':sel.quality==='bad'?'bad':'okay'}`;
    el.innerHTML = `
      <div class="fb-title">${sel.quality==='good'?'✅':sel.quality==='bad'?'❌':'⚠️'} ${fb.title}</div>
      <div class="fb-body">${fb.text}</div>
      ${fb.coach ? `<div class="fb-coach"><span class="coach-label">💡 Coaching Note</span>${fb.coach}</div>` : ''}`;
  }
  document.getElementById('nxt').classList.add('show');
}

function next() { qIdx++; answered=false; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function renderResults() {
  const total = score.good+score.okay+score.bad;
  const pct = Math.round(score.good/total*100);
  const clr = pct>=75?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
  const title = pct>=75?'Strong Advisory Skills':pct>=50?'Solid Foundation':'Keep Building';
  const msg = pct>=75
    ? "You demonstrated strong diagnostic instincts, appropriate product selection, and the ability to coordinate across accounts, products, and tax strategies. You're ready for complex client engagements."
    : pct>=50
    ? "You've got a good grasp of the fundamentals but missed some advanced planning opportunities. Review the coaching notes — especially around tax strategy, product sizing, and implementation phasing."
    : "This case study covers advanced concepts that take time to master. Focus on the coaching notes and consider reviewing the Tax-Smart Investing, Life Insurance, and Asset Allocation training decks for foundational concepts.";

  app.innerHTML = `
    <div class="score-card">
      <div class="score-ring" style="border-color:${clr}">
        <div class="num" style="color:${clr}">${pct}%</div>
        <div class="lbl" style="color:${clr}">Score</div>
      </div>
      <h2>${title}</h2>
      <p class="msg">${msg}</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="sn" style="color:var(--green)">${score.good}</div><div class="sl">Best Response</div></div>
        <div class="stat-box"><div class="sn" style="color:var(--amber)">${score.okay}</div><div class="sl">Acceptable</div></div>
        <div class="stat-box"><div class="sn" style="color:var(--red)">${score.bad}</div><div class="sl">Needs Work</div></div>
      </div>
      <button class="score-btn" onclick="startCase()">Try Again</button>
      <button class="score-btn sec" onclick="started=false;render()">Back to Overview</button>
    </div>
    <div class="rec-summary">
      <h3>Recommended Portfolio: The Martinelli Plan</h3>
      <div class="rec-row"><div class="rec-dot" style="background:var(--cyan)"></div><div class="rec-label">Diversified Equities (US, Intl, Small Cap)</div><div class="rec-val">~40%  |  $1,136K</div></div>
      <div class="rec-row"><div class="rec-dot" style="background:var(--green)"></div><div class="rec-label">Fixed Income (Bond Ladder + Core Bonds)</div><div class="rec-val">~28%  |  $795K</div></div>
      <div class="rec-row"><div class="rec-dot" style="background:var(--amber)"></div><div class="rec-label">Deferred Income Annuity</div><div class="rec-val">~12%  |  $340K</div></div>
      <div class="rec-row"><div class="rec-dot" style="background:var(--teal)"></div><div class="rec-label">Structured Notes (Buffered S&P)</div><div class="rec-val">~8%  |  $227K</div></div>
      <div class="rec-row"><div class="rec-dot" style="background:var(--purple)"></div><div class="rec-label">Alternatives (Private Credit, RE, Hedge)</div><div class="rec-val">~7%  |  $199K</div></div>
      <div class="rec-row"><div class="rec-dot" style="background:#bbb"></div><div class="rec-label">Cash & Short-Term Reserves</div><div class="rec-val">~5%  |  $142K</div></div>
    </div>`;
}

render();
</script>
</body>
</html>
